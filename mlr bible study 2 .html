Bible Study
JESUS
Our Focus In This Revival

Introduction

As we have been guided by the Lord in the past few years and considering the outburst that has come on our lives and in the work, the need to maintain our focus on God's plan and purpose for this divine visitation to the earth has become very crucial. The issue of maintaining the focus on what God is seeking to establish with our lives in His work at this time is very important lest we waste the outpouring of the Holy Spirit on things that would not fulfil God's desire for this move of God. Walking with a single eye on the goal; fighting not as one beating the air; running with a definite purpose and finishing the mandate you were given in life is the crux of our study in this year's MLR, even as we expect times of refreshing from the presence of the Lord.

A. Jesus: The Substance Of Our Message
Col. 2:17 NKJV, GNB, AMP

To be focused in life and particularly on God's purpose for this move, we must need to understand what the goal of this revival actually is. From the beginning to the end, Christ is God's divine agenda first for everyone and for every ministry approved by Him. In every form of it, anything that you are doing or involved in that does not point to Christ and does not focus on Christ, and for Christ to be formed in people is already off the point.

1. Jesus: God's Message To Us And Through Us
Heb. 1:1-3; Matt. 17:5; Col. 1:12-23, 27-29; 1Cor. 1:16-25; 1Cor. 2:1-5; 2Cor. 4:5-6

Let this matter sink into your heart today. God's message to mankind is Christ. All Scriptures are written to reveal Him. All messengers are raised and sent to speak of Him. We are called to become like Him in every respect and to let His life flow out through us as we live day by day.

PAGE 6

2. Jesus Says “I Am...”

Let us study what Christ Jesus says about Himself in the several “I am” we find in the word of God. Discuss the implications of this on our lives, our message and our labour in this revival.

a. The Light of life; the light of the world
Jn. 1:4, 9; Jn. 3:16-21; Jn. 8:12; Jn. 9:4-5; Matt. 5:14-16

b. The Bread of Life, the Living Bread
Jn. 6:31-35; Jn. 6:48-51; Jn. 6:56-58

c. The Door of the Sheep
Jn. 10:1-10; Rev. 3:7-8

d. The Good Shepherd
Jn. 10:11-16; 1Pet. 5:2-4

e. The Way, the Truth and the Life
Jn. 14:6; Jn. 1:16-17; Heb. 9:8; Rom. 5:2; Eph. 2:18; Eph. 3:12

f. The Resurrection and the Life
Jn. 11:25-26; Jn. 1:4

g. The True Vine
Jn. 15:1-7

You will not be serving God's divine purpose for your life unless Christ becomes central and all-encompassing in all you do. It is not you or your ministry that must increase; it is Christ that must increase and be known. It is Christ that God has appointed the heir of all things and it is out of His fullness that we all have received grace upon grace. We are heirs of God just because of Him and what He did at Calvary for us. No ministry pleases God unless it focuses on the Son. Anyone who does not have the Son does not have life and the wrath of God abides on him. No message impresses God if it is not centred on Christ and Him crucified. People are not being prepared for heaven unless Christ is formed in them. Whatever vision anyone is given in life should only be an expression of this agenda; Christ, the Son of God; Christ the Lord of all and Christ in you, the hope of glory.

God has introduced no other man on earth for us to follow or listen to. All others were and are only a shadow and an illustration of the Son. He is the substance and the reality.

3. God, The Father's Testimony About Jesus...

Let us study what the Father says about Jesus and why we must teach and preach Him, behold and follow Him to become like Him.

a. At the Baptism of John at the Jordan river
Matt. 3:13-17; Jn. 1:26-34

b. On the mount of transfiguration as the pattern Son
Matt. 17:1-8; Luk. 9:28-36; 2Pet. 1:16-18; Rom. 8:29

c. As God's pattern servant
Isa. 42:1-4; Mat. 12:15-21; Heb. 3:1-6; Heb. 5:4-6

d. Having become so much better than the angels
Heb. 1:1-13

PAGE 7

Moses and Elijah were great vessels God used in their generations and they stood significantly in the purpose of God, but they cannot stand at the same level with the Lord Jesus in our hearts. They cannot share the space with the Lord Jesus in our hearts. They are in the shadows and must continue to be overshadowed by Christ in all our lives and messages. The prophets and Moses are pointers to the Lord; how can we settle with the signboards and pointers and not follow the Lord?

No angel compares with Him and we cannot compare Him with any angel. John the Baptist captured this very clearly in His ministry as he repeatedly confessed “I am not the Christ”. John said he is not the true Light. He was just a voice sent to prepare His way. He was not the bridegroom. He who has the bride is the bridegroom. He said he is only a friend of the bridegroom who rejoices when he sees the bride hearing the voice of the bridegroom. John said, “He must increase and I must decrease” Jn. 1:19-23; Jn. 3:26-34.

We must behold Him for life and we must behold Him for ministry. We must follow in His footsteps if we hope to arrive on the shore of glory. “He who serves me, let him follow me” is what He said. Jn. 12:26; Heb. 12:2-3

4. Jesus Is The Rock, The Chief Cornerstone And The Foundation
Act. 4:10-12; 1Cor. 3:9-15; Matt. 7:24-27; Matt. 16:16-19; Isa. 28:14-16; Luk. 20:17-18; 1Pet. 2:4-7

Discuss the implication of this truth on all we have to do first in our own lives and in this labour for the building of the body of Christ and for the revival for which we are praying and labouring.

This is the emphatic declaration He made. This is the divine agenda God has fashioned for everyone He has called either into pulpit ministry or any other vocation among men. He is the foundation and the Chief cornerstone upon which God is building His work on earth. All builders must take cognisance of this or else they would be labouring in vain.

5. Jesus Is Our Passover Lamb, The Lamb Of God
Jn. 1:29, 35-36; Jn. 11:47-57; 1Cor. 5:7-8; Isa. 53:5-8; Col. 1:12-14; Heb. 9:14; Heb. 9:22-28

Discuss the biblical concept of the Passover lamb and now the lamb of God who was slain for our sins. What is the power in the blood of the Lamb for our lives today?

PAGE 8

6. Jesus Is Our High Priest
Heb. 2:17-18; Heb. 4:14-16; Heb. 5:1-5, 7; Heb. 7:12-28; Heb. 8:1-6; Eph. 2:18; Eph. 3:12; Heb. 9:22-28; Heb. 10:19-22

Highlight the crucial understanding we must have about Jesus as our High Priest and how does it impact on our pursuit of revival in the body of Christ?

He is the sum of all things. He is the high priest we have now who is set on the right of the throne of the Majesty in the heavens. He is the minister of the sanctuary and of the true tabernacle, which the Lord pitched and not man. It is in Him and through Him that our lives, service and sacrifice can be acceptable to God. We have no access to God except through this High Priest. It is for by Him and for Him that everything has its existence. He is the heir of all things...

Conclusion

To conclude on this divine agenda, let us note that Christ is God’s solution to all man's woes. He is the redeemer and the propitiation for all our predicaments and sins. He is the Way, the Truth and the Life. No one comes to the Father unless by Him. He is the one in whom God is pleased for the fullness of the deity to dwell in bodily form. He is the one that holds the keys of the kingdom. He is the door of the sheep. He is the solution to all the economic challenge in the nations. He is the light that shines and darkness cannot comprehend it. He is the end of the law of righteousness to all who believe. Rom. 10:1-4

B. What To Focus Upon In Christ

We have now come to the point of learning what to focus upon in Christ in order to stay focused and maintain a single eye on the divine agenda for which we were saved and called with this holy calling. While there is a lot to do in the work of the Lord, you must know that your call first and foremost is not to work for God but to believe in the Lord Whom He has sent. This is the work of God. God's first agenda is for you to believe in Jesus Christ, follow Him and to be conformed to His image. Jn. 6:27-29; Rom. 8:28-30. Read these also in the Amplified Bible version.

Walking with God must be given priority; it comes before any work you may do for God. If you focus on the work of God, you may actually miss the Lord. The ministry will become your idol and preoccupation. It is the Lord

PAGE 9

that must first be the focus of your life. It is as we focus on Jesus as the treasure of our lives and the treasure of our pursuit, that we would be focused on God's primary agenda for our lives and for our ministry.

Your ministerial focus will not be right unless Christ and Him crucified is your personal life focus. It is not the miracles He does for you that must be your focus. The people came seeking Him because of the bread they ate the other day. It must not be so with you. He Himself must be the bread of life we seek to eat day by day. His life is the bread we must eat daily to have life in ourselves. All who would not focus on Him already have no focus at all.

We shall consider this under nine sub-headings just for the sake of in-depth study. It will be vague if we just say, let us be focused on Jesus as the divine agenda. As preachers and leaders, as men and women standing for God on the pulpit, in the society among the business men, politicians, academics and other professionals, what do we focus upon in Christ Jesus as God's agenda for us and for this generation?

1. You Must Focus On Jesus As The Invaluable, Unfading Treasure Of Your Life
Matt. 13:44-46; Jn. 3:16; Jn. 4:10-14; 2Cor. 9:15

a. Look at what Jesus said about the treasure of the kingdom.
i. Discuss this parable. What could make this merchant man take such a drastic decision? What is his valuation of the treasure he found?
ii. When Jesus said the kingdom of heaven is like this, what does it imply in your heart? Is there any other way to possess the kingdom without selling all you have to purchase it?
iii. What then will this treasure from heaven cost you?

b. Look at the condition Jesus laid for the disciples who wanted to follow Him. Luk. 14:25-33; Mk. 10:17-31.
i. Discuss what you understand about what to let go in order to have this treasure of knowing and following Christ.
ii. What was the demand of Christ on the rich young ruler because He loved him for him to have treasure in heaven?
iii. What was his major obstacle unto possessing this treasure and what was Christ conclusion?
iv. Discuss the reaction and response of the disciples. How do you also honestly consider this matter of selling all to purchase this treasure?
v. Analyse the Lord's instruction as regards where and how to lay our treasures Matt. 6:19-21; Mk. 10:21.

PAGE 10

Where a man's treasure is, there will his heart be. Focus is determined by what you estimate as a treasure. To stay focussed on this divine agenda for calling you, Christ must be the treasure you are willing to sell all that you have to possess. If there is any other treasure elsewhere for you that have not been laid down at His feet in order to possess “this field,” it will surely divide your focus. You will not be able to maintain a single eye.

It is not just about things and properties that we are concerned here; the Lord also talked about your relationships and your own life also Lk. 14:26. Christ is the treasure for which we must be ready to sell all. As disciples came and expressed their desire to follow Him, it was the same condition He confronted them with. “Whosoever he be of you that does not forsake all that he has, he cannot be my disciple”. Christ is the treasure we must pursue. Knowing Him will pay off for us. If you do not meet this initial condition of leaving all to pursue Christ, it will be difficult for you to maintain a single focus in your pursuit of Him.

c. Look at Paul's testimony Phi. 3:4-14; Phi. 1:20-21
i. Discuss what were the things he left to purchase this treasure Phi. 3:4-8. Read it also in the Amplified Bible version.
ii. What was his estimation or valuation of this treasure he has found in Christ? Phi. 3:7-10
iii. How did he pursue Christ as the treasure of his life now? Phi. 3:10-14

It is clear that Paul left all to follow Jesus and gain Him. All that was gain to him, he counted but dung in order to win Christ. He looked at all that he used to brag about in the flesh, compared with his estimate of the invaluable Christ, and came to conclude that they were all as one combined loss for Christ's sake.

Someone would normally turn back from focussing on the divine agenda like Lot's wife as long as he has something valuable to him in “Sodom and Gomorrah”. Remember Lot's wife Gen. 19:26; Lk. 17:31-32. She looked back because her treasures were in that land of perdition.

PAGE 11

What is your treasure? And where is your treasure? Check your heart at this point and ask a very honest question: What and what are my treasures and where have I laid them? You cannot set your affection where your treasure is not located Col. 3:1-2.

This is the next issue we must consider in staying focused on the divine agenda. Christ is not just the invaluable treasure we must purchase with all that we have; He is the source and goal of our faith. He is the author and the finisher of our faith. There would be no need to run in this race if there is no goal ahead of us. All who run in a race keep their eyes on the finishing line and the prize. Christ is both the source and the goal of our faith. He is the One who originated and began our faith and He is the goal, the end point, of it. Your life and ministry will be in vain if you do not eventually stand before Him and have Him as your prize. He is not just an example for us to look up to; He is the source of all we have and He is also the goal. He is the author and the finisher. He is the Alpha and the Omega of our faith.

const modalBg = document.getElementById("modalBg");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const closeBtn = document.getElementById("closeBtn");
const cache = {};

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeRegex(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function convertReferencesToButtons(text) {
  let html = escapeHtml(text);

  const labels = Object.keys(referenceMap).sort((a, b) => b.length - a.length);
  const pattern = new RegExp(labels.map(escapeRegex).join("|"), "g");

  html = html.replace(pattern, match => {
    const apiRef = referenceMap[match];
    return `<button class="scripture-btn" data-ref="${escapeHtml(apiRef)}">${escapeHtml(match)}</button>`;
  });

  html = html
    .replace(/\n{2,}/g, "</p><p>")
    .replace(/\n/g, "<br>");

  return `<p>${html}</p>`;
}

document.getElementById("pdfText").innerHTML = convertReferencesToButtons(studyText.trim());

async function fetchPassage(ref) {
  if (cache[ref]) return cache[ref];

  const url = "https://bible-api.com/" + encodeURIComponent(ref) + "?translation=kjv";
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Could not load " + ref);
  }

  const data = await response.json();
  cache[ref] = data;
  return data;
}

function passageHtml(data, requestedRef) {
  const title = data.reference || requestedRef;
  let html = `<article><h3>${escapeHtml(title)}</h3>`;

  if (data.verses && data.verses.length) {
    html += data.verses.map(v => `
      <p class="verse">
        <span class="verse-num">${escapeHtml(v.verse)}</span>
        ${escapeHtml(v.text.trim())}
      </p>
    `).join("");
  } else {
    html += `<p>${escapeHtml(data.text || "")}</p>`;
  }

  html += `</article>`;
  return html;
}

async function openScripture(button) {
  const label = button.textContent.trim();
  const refs = button.dataset.ref.split("|").map(r => r.trim()).filter(Boolean);

  modalTitle.textContent = label;
  modalBody.innerHTML = `<p class="loading">Loading scripture text...</p>`;
  modalBg.classList.add("open");

  try {
    const passages = await Promise.all(refs.map(fetchPassage));
    modalBody.innerHTML = passages
      .map((data, index) => passageHtml(data, refs[index]))
      .join("<hr>");
  } catch (err) {
    const search = encodeURIComponent(refs.join("; "));
    modalBody.innerHTML = `
      <div class="error">
        Scripture could not be loaded automatically.
        <br><br>
        <a href="https://www.biblegateway.com/passage/?search=${search}&version=KJV" target="_blank">
          Open this passage on BibleGateway
        </a>
      </div>
    `;
  }
}

document.querySelectorAll(".scripture-btn").forEach(button => {
  button.addEventListener("click", () => openScripture(button));
});

function closeModal() {
  modalBg.classList.remove("open");
}

closeBtn.addEventListener("click", closeModal);

modalBg.addEventListener("click", e => {
  if (e.target === modalBg) closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});
</script>

</body>
</html>
